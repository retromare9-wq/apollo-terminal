<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Stationsplan Export</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/apollo.css">
<style>
  html, body { overflow: visible; height: auto; background: #0a0604; }
  body { margin: 0; padding: 40px 50px; width: 3600px; color: var(--amber); font-family: var(--font); }
  h1 { margin: 0 0 6px; font-size: 54px; letter-spacing: .08em; color: var(--yellow); }
  .sub { font-size: 26px; margin-bottom: 20px; color: var(--amber); }
  #map { display: block; width: 3600px; }
  .st-wall { stroke-width: 3; }
  .st-inner { stroke-width: 1.5; }
  .st-door-gap { stroke-width: 7; }
  .st-door { stroke-width: 2.5; }
  .st-cam { fill: var(--mint); }
  .legend { display: flex; gap: 60px; margin-top: 24px; font-size: 26px; align-items: center; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; }
  .legend i { display: inline-block; vertical-align: middle; margin-right: 14px; }
</style>
</head>
<body>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="legend" id="legend"></div>
<script type="module">
  import { CONFIG, STATION } from '../js/data.js';
  import { drawStationPlan } from '../js/stationplan.js';
  import { el } from '../js/svg.js';

  const gm = new URLSearchParams(location.search).has('gm');
  const level = STATION.levels[0];
  const svg = document.getElementById('map');
  const g = el('g', {}, svg);
  const info = drawStationPlan(g, CONFIG, STATION, () => '');
  const b = level.bounds;
  const pad = 140;
  const vb = { x: b[0] - pad, y: b[1] - pad, w: b[2] - b[0] + pad * 2 + 300, h: b[3] - b[1] + pad * 2 + 60 };
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  svg.style.height = `${(3600 * vb.h) / vb.w}px`;
  svg.style.setProperty('--k', ((vb.w / 3600) * 2.4).toFixed(4));

  if (gm) {
    level.rooms.filter((r) => r.cams).forEach((r) => {
      const [x0, y0, x1] = r.rects[0];
      el('circle', { cx: x1 - 14, cy: y0 + 14, r: 8, class: 'st-cam' }, g);
    });
  }

  document.getElementById('title').textContent = `${CONFIG.station} // ${level.name}`;
  document.getElementById('sub').textContent =
    `${CONFIG.company} · ${CONFIG.moon} · ${CONFIG.planet} · ${CONFIG.star} · ${CONFIG.sector}${gm ? ' · SPIELLEITER-VERSION' : ''}`;
  const sw = (html) => `<svg width="70" height="34" viewBox="0 0 70 34">${html}</svg>`;
  document.getElementById('legend').innerHTML = [
    [sw('<rect x="2" y="2" width="66" height="30" fill="#4a2012"/>'), 'GANG'],
    [sw('<rect x="2" y="2" width="66" height="30" fill="#140a05" stroke="#c8872a" stroke-width="3"/><line x1="22" y1="32" x2="48" y2="32" stroke="#4a2012" stroke-width="7"/><line x1="22" y1="32" x2="48" y2="32" stroke="#6cc495" stroke-width="2.5" stroke-dasharray="2 2"/>'), 'RAUM MIT TÜR'],
    [sw('<rect x="2" y="2" width="66" height="30" fill="#4a2012"/><rect x="30" y="2" width="10" height="30" fill="#d0492f"/>'), 'GESICHERTE TÜR'],
    [sw('<rect x="2" y="2" width="66" height="30" fill="#4a2012"/><rect x="32" y="2" width="6" height="30" fill="#9a6ad0"/>'), 'NORMALE TÜR'],
    [sw('<rect x="2" y="2" width="33" height="30" fill="#e3cb5c"/><path d="M8 8 L29 26 M29 8 L8 26" stroke="#1a0e05" stroke-width="2"/><rect x="35" y="2" width="33" height="30" fill="#0f0806" stroke="#7d5421"/><path d="M43 4 v26 M51 4 v26 M59 4 v26" stroke="#7d5421"/>'), 'AUFZUG + LEITERGANG'],
    ...(gm ? [[sw('<circle cx="35" cy="17" r="10" fill="#6cc495"/>'), 'KAMERA IM RAUM']] : []),
  ].map(([s, t]) => `<span>${s}${t}</span>`).join('');
  document.body.dataset.ready = '1';
</script>
</body>
</html>
