<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A.P.O.L.L.O. Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/apollo.css?v=32646ef036">
  <script>
    // Startwächter: Lädt der Code nicht (z. B. alte Dateien im Browser-Cache), Hinweis statt leerer Seite
    (function () {
      var shown = false;
      function show(msg) {
        if (shown || window.__apolloReady) return;
        shown = true;
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0a0604;color:#d4702c;font:16px/1.6 monospace;display:flex;align-items:center;justify-content:center;padding:40px;text-align:center';
        d.innerHTML = '<div><b style="color:#e3cb5c;font-size:20px">A.P.O.L.L.O. KONNTE NICHT STARTEN</b><br><br>Bitte die Seite neu laden mit <b>Strg + Umschalt + R</b> (Mac: Cmd + Shift + R).<br>Deine gespeicherten Daten bleiben erhalten.<br><br><span style="color:#8a4320;font-size:12px">' + String(msg || '').replace(/[<>&]/g, '') + '</span></div>';
        document.body.appendChild(d);
      }
      addEventListener('error', function (e) { show(e.message); });
      addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message); });
      addEventListener('load', function () { setTimeout(function () { show('Startzeit überschritten'); }, 6000); });
    })();
  </script>

<body class="crt">
  <div class="screen">
    <div id="boot" class="boot"></div>

    <div id="app" class="app" hidden>
      <header class="top">
        <div class="titlebar"><div class="titlebar-inner"><span id="title"></span><span id="title-right"></span></div></div>
        <div class="infobox">
          <div class="info-row"><span id="info-model"></span><span id="info-logo" class="info-logo"></span></div>
          <div class="info-row plain"><span id="info-code"></span><span id="info-date"></span></div>
        </div>
      </header>

      <main class="frame">
        <div id="view" class="view"></div>
        <div class="cmdline"><span class="prompt">&gt;</span><span id="cmd"></span><span class="cursor">█</span></div>
      </main>

      <footer class="bottom">
        <div class="status">
          <span id="f-sd" class="crit blink" hidden></span>
          <span id="f-hint" class="hint"></span>
        </div>
        <div class="lockbox">
          <div class="lb-row"><span id="f-user"></span><span id="f-level"></span></div>
          <div class="lb-row keys"><span><b class="hk">W</b> ZUGANG</span><span><b class="hk">X</b> ABMELDEN</span></div>
        </div>
      </footer>
    </div>

    <div class="crt-overlay"></div>
  </div>
